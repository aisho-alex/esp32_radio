; FM Radio Web Interface — ESP32 / ESP32-C3 / ESP8266
; Сборка: ~/.platformio/penv/bin/pio run -e <env> (или панель PlatformIO в VS Code)

[env]
monitor_speed = 115200
build_src_filter = +<*> -<native_stub.cpp>
lib_deps =
    pu2clr/PU2CLR RDA5807@^1.1.9
    bblanchon/ArduinoJson@^6.21.0
    marcoschwartz/LiquidCrystal_I2C@^1.1.2
    adafruit/RTClib@^2.1.4

; ESP32 DevKit (WROOM-32): SDA=GPIO21, SCL=GPIO22; encoder A=32 B=33 SW=25
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
build_flags =
    -DI2C_SDA=21
    -DI2C_SCL=22
    -DENC_A=32
    -DENC_B=33
    -DENC_SW=25

; ESP32-C3 DevKitM-1: SDA=GPIO8, SCL=GPIO9; encoder A=4 B=5 SW=6
[env:esp32-c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
build_flags =
    -DI2C_SDA=8
    -DI2C_SCL=9
    -DENC_A=4
    -DENC_B=5
    -DENC_SW=6

; ESP8266 NodeMCU (обратная совместимость): SDA=D1(GPIO5), SCL=D2(GPIO4); encoder A=D5 B=D6 SW=D7
[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
board_build.f_cpu = 160000000L
build_flags =
    -DI2C_SDA=D1
    -DI2C_SCL=D2
    -DENC_A=D5
    -DENC_B=D6
    -DENC_SW=D7

; Юнит-тесты на хосте (без железа): pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
build_src_filter = +<native_stub.cpp>  ; test-only env, no firmware sources
